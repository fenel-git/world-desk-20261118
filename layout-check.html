<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Desk layout check</title>
<style>
*{box-sizing:border-box}
body{margin:1rem;font:16px Arial,sans-serif;color:#211914;background:#fcf2e4}
iframe{position:absolute;left:-12000px;top:0;border:0}
pre{white-space:pre-wrap}
</style>
<h1>World Desk layout check</h1>
<pre id="result">Checking…</pre>
<script>
const sizes=[1024,600,300];
const modes=['','?open=1'];
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function check(width,mode){
 const frame=document.createElement('iframe');
 frame.title=`${width}px ${mode||'default'} preview`;
 frame.style.width=`${width}px`;
 frame.style.height='1024px';
 const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
 frame.src=new URL(`frontpage.html${mode}`,location.href);
 document.body.append(frame);
 await loaded;
 await delay(100);
 const w=frame.contentWindow,d=frame.contentDocument;
 const hide=d.createElement('style');
 hide.textContent='html{scrollbar-width:none}::-webkit-scrollbar{display:none}';
 d.head.append(hide);
 const css=e=>getComputedStyle(e);
 const headline=d.querySelector('.lead h2');
 const card=d.querySelector('.mid h2');
 const brief=d.querySelector('.briefs li');
 const overflowing=[...d.querySelectorAll('h1,h2,p,.meta,.briefs li,.legend,.strap span,footer span')]
  .filter(e=>e.scrollWidth>e.clientWidth+1).length;
 const footer=d.querySelector('footer').getBoundingClientRect();
 const sections=['header','.lead','.mid','.bottom','footer'].map(selector=>{const r=d.querySelector(selector).getBoundingClientRect();return {name:selector,top:+r.top.toFixed(2),bottom:+r.bottom.toFixed(2)}});
 const counts={lead:d.querySelectorAll('.lead article').length,cards:d.querySelectorAll('.mid article').length,briefs:d.querySelectorAll('.briefs li').length};
 const html=d.documentElement,body=d.body;
 const result={width,open:!!mode,fonts:{lead:parseFloat(css(headline).fontSize),card:parseFloat(css(card).fontSize),brief:parseFloat(css(brief).fontSize)},counts,sections,textOverflow:overflowing,horizontalOverflow:html.scrollWidth>w.innerWidth||body.scrollWidth>w.innerWidth,footerBottom:Math.round(footer.bottom),squareOverflow:width===1024&&footer.bottom>1024};
 frame.remove();
 return result;
}
(async()=>{
 const results=[];
 for(const width of sizes)for(const mode of modes)results.push(await check(width,mode));
 const pass=results.every(r=>r.textOverflow===0&&!r.horizontalOverflow&&!r.squareOverflow&&(r.width!==1024||(r.fonts.lead>=32&&r.fonts.card>=25&&r.fonts.brief>=19))&&(r.width===1024||r.fonts.lead>=16&&r.fonts.card>=16&&r.fonts.brief>=15.5));
 const report={pass,results};
 document.getElementById('result').textContent=JSON.stringify(report,null,2);
 document.documentElement.dataset.pass=String(pass);
})();
</script>
</html>
